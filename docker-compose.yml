services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      ZZ_DATA_DIR: /data
      ZZ_TENANT_ID: ${ZZ_TENANT_ID:-demo-tenant}
      ZZ_AI_BASE_URL: ${ZZ_AI_BASE_URL:-}
      ZZ_AI_API_KEY: ${ZZ_AI_API_KEY:-}
      ZZ_AI_MODEL: ${ZZ_AI_MODEL:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
